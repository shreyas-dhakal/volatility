[project]
name = "galvanise-api"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2",
    "openai>=2",
    "networkx>=3",
    "httpx>=0.28",
    "cryptography>=44",
    "python-multipart>=0.0.20",
    "pypdf>=5",
    "python-docx>=1",
    "clerk-backend-api>=7.1.0",
    "graphifyy==0.9.111",
]
[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.9"]
[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
